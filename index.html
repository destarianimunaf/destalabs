<style>

.bg-blob.b1{width:440px;height:440px;background:#C4A8FA;top:-140px;right:-100px;animation:floatA 19s ease-in-out infinite;}
.bg-blob.b2{width:400px;height:400px;background:#FFD966;top:560px;left:-160px;animation:floatB 23s ease-in-out infinite;}
.bg-blob.b3{width:360px;height:360px;background:#9B6FF0;bottom:-100px;right:8%;animation:floatC 21s ease-in-out infinite;}
.bg-blob.b4{width:300px;height:300px;background:#FFE38A;top:1150px;right:-90px;opacity:0.26;animation:floatA 17s ease-in-out infinite reverse;}

@keyframes floatB{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-45px,30px) scale(1.05);}}
@keyframes floatC{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(25px,-35px) scale(1.1);}}

.nav-links{display:flex;align-items:center;gap:22px;font-size:0.9rem;font-weight:500;}
.nav-links > a{text-decoration:none;color:var(--ink-soft);transition:color .15s;}
.nav-links > a:hover{color:var(--ink);}
.nav-toggle{display:none;background:none;border:none;font-size:1.3rem;color:var(--ink);padding:6px;}
.nav-dropdown{position:relative;}
.nav-dropdown-trigger{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:0.9rem;font-weight:500;display:flex;align-items:center;gap:5px;padding:0;}
.nav-dropdown-trigger:hover{color:var(--ink);}
.nav-dropdown-trigger .caret{font-size:0.65rem;transition:transform .15s;}
.nav-dropdown.open .caret{transform:rotate(180deg);}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 12px);left:0;min-width:230px;background:rgba(255,255,255,0.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.9);border-radius:14px;padding:8px;box-shadow:var(--shadow);flex-direction:column;gap:2px;}
.nav-dropdown.open .nav-dropdown-menu{display:flex;}
.nav-dropdown-menu a{padding:9px 12px;border-radius:9px;font-size:0.85rem;color:var(--ink);text-decoration:none;}

.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:600;font-size:0.86rem;transition:transform .15s,box-shadow .15s;}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,0.35);}

.btn-ghost{background:rgba(255,255,255,0.55);color:var(--ink);border:1px solid rgba(255,255,255,0.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.card{border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s;}
.card:hover{transform:translateY(-3px);}
.card-media,.card-media-placeholder svg{transition:transform .5s ease;}

.card-media-wrap{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;cursor:pointer;}
.card-media{width:100%;height:100%;object-fit:cover;display:block;background:#eee;}

.card-tags{display:flex;gap:6px;flex-wrap:wrap;}

.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;}
.empty-state{grid-column:1/-1;text-align:center;padding:48px 20px;border:1.5px dashed rgba(255,255,255,0.8);border-radius:var(--radius);color:var(--ink-soft);}

.admin-panel{border-radius:var(--radius);padding:24px;}

.bio-card{border-radius:var(--radius);padding:24px;}

.calc-card{border-radius:var(--radius);padding:24px;}

input.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--line);outline:none;margin-top:8px;}
input.slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(124,58,237,0.45);}
input.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;box-shadow:0 2px 8px rgba(124,58,237,0.45);}
.proj-card{padding:16px 0;border-bottom:1px solid var(--line);}
.proj-card:last-of-type{border-bottom:none;}
.proj-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
.proj-name{font-weight:700;font-family:'Space Grotesk',sans-serif;}
.proj-numbers{display:flex;gap:18px;flex-wrap:wrap;font-size:0.82rem;color:var(--ink-soft);}
.proj-numbers b{color:var(--ink);}
.chart-label{font-size:0.74rem;color:var(--ink-soft);margin:6px 0 6px;}
.growth-chart{width:100%;height:100px;display:block;}
.calc-total{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:1rem;color:var(--ink-soft);}
.calc-total b{color:var(--accent);font-family:'Space Grotesk',sans-serif;font-size:1.1rem;}
.calc-disclaimer{margin-top:12px;font-size:0.76rem;color:var(--ink-soft);}
.progress-track{width:100%;height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#7C3AED,#FFD966);border-radius:999px;transition:width .4s ease;}
.progress-caption{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--ink-soft);margin-top:6px;}
.contact-card{border-radius:var(--radius);padding:26px;max-width:520px;}
.contact-status{margin-top:14px;font-size:0.85rem;padding:10px 14px;border-radius:10px;}
.contact-status.sent{background:rgba(191,232,212,0.6);color:#1F5C43;}
.contact-status.error{background:rgba(247,201,203,0.6);color:#7A2E33;}
.submissions-table{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:12px;}
.submissions-table th,.submissions-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
.submissions-table th{color:var(--ink-soft);font-weight:600;}
@media(max-width:860px){

.hero-art{order:-1;}
.grid{grid-template-columns:repeat(2,1fr);}
.nav-toggle{display:block;}
.nav-links{display:none;position:absolute;top:56px;left:0;right:0;flex-direction:column;align-items:flex-start;gap:6px;background:rgba(255,255,255,0.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.6);padding:14px 20px 18px;box-shadow:var(--shadow);}
.nav-links.open{display:flex;}
.nav-links > a{padding:8px 0;}

.nav-dropdown-trigger{padding:8px 0;width:100%;justify-content:space-between;}
.nav-dropdown-menu{position:static;display:none;box-shadow:none;border:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 0 4px 10px;min-width:0;}
.nav-dropdown.open .nav-dropdown-menu{display:flex;}
.admin-grid{grid-template-columns:1fr;}
.drive-embed-wrap iframe{height:420px;}

}
@media(max-width:540px){
.grid{grid-template-columns:1fr;}
.hero{padding:40px 0 28px;}
.section{padding:40px 0;}
.drive-embed-wrap iframe{height:360px;}
.bg-blob{opacity:0.22;}
.calc-row{grid-template-columns:1fr;}
}
</style>
</head>

<script>
var h = React.createElement;

var INSTAGRAM_URL = "https://instagram.com/destarianimunaf";
var GITHUB_URL = "https://github.com/destarianimunaf";
var ADMIN_PASSCODE = "changeme123";
var DRIVE_FOLDER_ID = "1ZcH24TTfnV39kNLNp00V0ATDERa1iV4M";
var SHEET_CSV_URL = "";
var CONTACT_FORM_ACTION_URL = "";
var CONTACT_FORM_EMAIL_ENTRY = "";
var CONTACT_FORM_MESSAGE_ENTRY = "";
var CONTACT_SHEET_CSV_URL = "";

var SKILLS = [
  {sym:"REACT",label:"Frontend",trend:"up",change:"+2.4%"},
  {sym:"ILLUS",label:"Illustration",trend:"up",change:"+1.1%"},
  {sym:"UI/UX",label:"Product design",trend:"flat",change:"0.0%"},

  {sym:"GIT",label:"Version control",trend:"flat",change:"0.0%"},
  {sym:"FIGMA",label:"Prototyping",trend:"up",change:"+1.6%"}
];

var INITIAL_PORTFOLIO = [
  {id:1,title:"Illustration I",tags:["Illustration"],image:"https://drive.google.com/uc?export=view&id=1OXTlKpP8r_Jy6T7Vtb_m6lU3vIn27FFB"},
  {id:2,title:"Illustration II",tags:["Illustration"],image:"https://drive.google.com/uc?export=view&id=18nWVWSZpbualJwmwxvtWfTSmN4x0ifrd"},
  {id:3,title:"Illustration III",tags:["Illustration"],image:"https://drive.google.com/uc?export=view&id=1-3CwrrZhpsOtj9_NBe4pBGo1vmd9fg2C"}
];

function normalizeDriveUrl(u){
  if(!u) return "";
  var m1 = u.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m1) return "https://drive.google.com/uc?export=view&id=" + m1[1];
  var m2 = u.match(/[?&]id=([^&]+)/);
  if(m2 && u.indexOf("drive.google.com") !== -1) return "https://drive.google.com/uc?export=view&id=" + m2[1];
  return u;
}

function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else if(c === '"'){ inQuotes = true; }
    else if(c === ','){ row.push(field); field = ""; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = ""; rows.push(row); row = [];
    } else field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length > 1 || (r.length === 1 && r[0] !== ""); });
}

function loadFromSheet(setItems){
  if(!SHEET_CSV_URL) return;
  fetch(SHEET_CSV_URL).then(function(r){ return r.text(); }).then(function(text){
    var rows = parseCSV(text);
    if(rows.length < 2) return;
    var header = rows[0].map(function(x){ return x.trim().toLowerCase(); });
    var ti = header.indexOf("title"), ta = header.indexOf("tags"), im = header.indexOf("image");
    if(ti === -1 || im === -1) return;
    var parsed = rows.slice(1).filter(function(r){ return r[ti]; }).map(function(r, i){
      return {
        id: 5000 + i,
        title: r[ti],
        tags: (ta !== -1 && r[ta]) ? r[ta].split("|").map(function(t){ return t.trim(); }).filter(Boolean) : ["Illustration"],
        image: normalizeDriveUrl((r[im] || "").trim())
      };
    });
    if(parsed.length) setItems(parsed);
  }).catch(function(){});
}

function formatRupiah(n){
  if(!isFinite(n)) return "Rp0";
  return "Rp" + Math.round(n).toLocaleString("id-ID");
}

function requiredMonthlyForTarget(target, monthlyRate, months){
  if(months <= 0) return target;
  if(monthlyRate > 0) return target * monthlyRate / (Math.pow(1 + monthlyRate, months) - 1);
  return target / months;
}

function buildSeries(startBalance, monthly, monthlyRate, years){
  var balance = startBalance;
  var series = [balance];
  var n = Math.max(1, years);
  for(var y = 1; y <= n; y++){
    for(var m = 0; m < 12; m++){ balance = balance * (1 + monthlyRate) + monthly; }
    series.push(balance);
  }
  return series;
}

function computeChildResult(child){
  var inflation = 0.08;
  var years = Number(child.years) || 0;
  var cost = Number(child.cost) || 0;
  var rate = Number(child.rate) || 0;
  var futureCost = cost * Math.pow(1 + inflation, years);
  var monthlyRate = rate / 100 / 12;
  var months = years * 12;
  return { futureCost: futureCost, requiredMonthly: requiredMonthlyForTarget(futureCost, monthlyRate, months) };
}

function computeEmergencyResult(e){
  var monthlyExpenses = Number(e.monthlyExpenses) || 0;
  var months = Number(e.months) || 0;
  var currentSavings = Number(e.currentSavings) || 0;
  var monthlySaving = Number(e.monthlySaving) || 0;
  var target = monthlyExpenses * months;
  var gap = Math.max(0, target - currentSavings);
  var monthsToGoal = monthlySaving > 0 ? gap / monthlySaving : null;
  var pct = target > 0 ? Math.min(100, (currentSavings / target) * 100) : 0;
  return { target: target, gap: gap, monthsToGoal: monthsToGoal, pct: pct };
}

function computeRetirementResult(r){
  var inflation = 0.05;
  var currentAge = Number(r.currentAge) || 0;
  var retireAge = Number(r.retireAge) || 0;
  var monthlyExpense = Number(r.monthlyExpense) || 0;
  var lifeExpectancy = Number(r.lifeExpectancy) || 0;
  var currentSavings = Number(r.currentSavings) || 0;
  var rate = Number(r.rate) || 0;
  var yearsToRetire = Math.max(0, retireAge - currentAge);
  var monthsToRetire = yearsToRetire * 12;
  var monthlyRate = rate / 100 / 12;
  var inflatedMonthlyExpense = monthlyExpense * Math.pow(1 + inflation, yearsToRetire);
  var totalPotNeeded = inflatedMonthlyExpense * 12 * lifeExpectancy;
  var fvCurrentSavings = currentSavings * Math.pow(1 + monthlyRate, monthsToRetire);
  var remaining = Math.max(0, totalPotNeeded - fvCurrentSavings);
  var requiredMonthly = requiredMonthlyForTarget(remaining, monthlyRate, monthsToRetire);
  return { yearsToRetire: yearsToRetire, inflatedMonthlyExpense: inflatedMonthlyExpense, totalPotNeeded: totalPotNeeded, requiredMonthly: requiredMonthly };
}

function GrowthChart(props){
  var points = props.points, uid = "gc" + props.uid;
  var vw = 400, vh = 110, pad = 8;
  var maxVal = Math.max.apply(null, points) || 1;
  var stepX = (vw - 2 * pad) / (points.length - 1 || 1);
  var coords = points.map(function(v, i){
    var x = pad + i * stepX;
    var y = vh - pad - (v / maxVal) * (vh - 2 * pad);
    return x + "," + y;
  }).join(" ");
  var areaPoints = coords + " " + (vw - pad) + "," + (vh - pad) + " " + pad + "," + (vh - pad);
  return h("svg",{viewBox:"0 0 " + vw + " " + vh, preserveAspectRatio:"none", className:"growth-chart"},
    h("defs",null,
      h("linearGradient",{id:uid,x1:"0",y1:"0",x2:"0",y2:"1"},
        h("stop",{offset:"0%",stopColor:"#7C3AED",stopOpacity:0.4}),
        h("stop",{offset:"100%",stopColor:"#7C3AED",stopOpacity:0.03})
      )
    ),
    h("polygon",{points:areaPoints,fill:"url(#" + uid + ")"}),
    h("polyline",{points:coords,fill:"none",stroke:"#7C3AED",strokeWidth:3,strokeLinecap:"round",strokeLinejoin:"round"})
  );
}

          h("p",{style:{color:"var(--ink-soft)",lineHeight:1.7}},"Illustration, investing, and personal finance don't look related at first, but they run on the same instinct for me — patient, incremental progress that only shows its shape after a long stretch of small, consistent decisions. A single illustration is a hundred tiny strokes. A retirement fund is a hundred tiny monthly transfers. An emergency fund is the unglamorous discipline that makes the other two possible without panic when something goes wrong."),
          h("p",{style:{color:"var(--ink-soft)",lineHeight:1.7}},"Keeping all three on one page isn't really about tidiness. It's closer to how I actually think about building anything worth having — and it's also why this site is built the way it is: static, no server, no hosting bill, plain HTML and JavaScript served straight from GitHub Pages. For something that mostly needs to display and occasionally update, a stateless page is simpler to reason about and cheaper to run — the same logic that favors a well-chosen index fund over a portfolio that demands constant rebalancing.")
        )
      )
    ),

    h("section",{className:"section",id:"calc-education"},
      h("div",{className:"wrap"},
        h("div",{className:"section-head"},
          h("div",{className:"eyebrow"}, h("span",{className:"dot"}), " Investment"),
          h("h2",null,"Education Fund Calculator"),
          h("p",{className:"section-sub"},"Results update as you move each slider. Estimates assume 8% annual education cost inflation.")
        ),
        h("div",{className:"calc-card glass"},
          h("h3",{className:"calc-subhead"},"Children"),
          children.map(function(child){
            return h("div",{className:"calc-row",key:child.id},
              h("div",{className:"field"},
                h("label",null,"Name"),
                h("input",{value:child.name,onChange:function(e){updateChild(child.id,"name",e.target.value);}})
              ),
              h("div",{className:"field"},
                h("label",null,"Current annual cost"),
                h("input",{type:"range",className:"slider",min:5000000,max:200000000,step:1000000,value:child.cost,onChange:function(e){updateChild(child.id,"cost",e.target.value);}}),
                h("small",null, formatRupiah(child.cost) + " / year")
              ),
              h("div",{className:"field"},
                h("label",null,"Years to goal"),
                h("input",{type:"range",className:"slider",min:1,max:20,step:1,value:child.years,onChange:function(e){updateChild(child.id,"years",e.target.value);}}),
                h("small",null, child.years + " years")
              ),
              h("div",{className:"field"},
                h("label",null,"Expected return"),
                h("input",{type:"range",className:"slider",min:0,max:20,step:0.5,value:child.rate,onChange:function(e){updateChild(child.id,"rate",e.target.value);}}),
                h("small",null, child.rate + "% / year")
              ),
              children.length > 1 && h("button",{type:"button",className:"btn btn-danger btn-small",onClick:function(){removeChild(child.id);}},"Remove")
            );
          }),
          h("div",{className:"form-row"},
            h("button",{type:"button",className:"btn btn-ghost btn-small",onClick:addChild},"+ Add another child")
          ),

          h("h3",{className:"calc-subhead calc-subhead-spaced"},"Projection"),
          children.map(function(child){
            var result = computeChildResult(child);
            var series = buildSeries(0, result.requiredMonthly, (Number(child.rate)||0)/100/12, Number(child.years)||1);
            return h("div",{className:"proj-card",key:"p"+child.id},
              h("div",{className:"proj-head"},
                h("span",{className:"proj-name"}, child.name),
                h("span",{className:"proj-numbers"},
                  h("span",null, "Target: ", h("b",null,formatRupiah(result.futureCost))),
                  h("span",null, "Monthly investment: ", h("b",null,formatRupiah(result.requiredMonthly)))
                )
              ),
              h("div",{className:"chart-label"},"Fund growth curve"),
              h(GrowthChart,{points:series,uid:"edu"+child.id})
            );
          }),
          h("div",{className:"calc-total"},
            "Total monthly investment across all children: ",
            h("b",null, formatRupiah(children.reduce(function(sum,c){ return sum + computeChildResult(c).requiredMonthly; },0)))
          ),
          h("p",{className:"calc-disclaimer"},"Estimates only, based on the inflation and return assumptions you set. Actual investment results may differ.")
        )
      )
    ),

    h("section",{className:"section",id:"calc-retirement"},
      h("div",{className:"wrap"},
        h("div",{className:"section-head"},
          h("div",{className:"eyebrow"}, h("span",{className:"dot"}), " Investment"),
          h("h2",null,"Retirement Fund Calculator"),
          h("p",{className:"section-sub"},"Estimates the pot you'll need at retirement, and the monthly investment required to get there, assuming 5% annual living-cost inflation.")
        ),
        h("div",{className:"calc-card glass"},
          h("div",{className:"calc-row"},
            h("div",{className:"field"},
              h("label",null,"Current age"),
              h("input",{type:"range",className:"slider",min:18,max:60,step:1,value:retirement.currentAge,onChange:function(e){updateRetirement("currentAge",e.target.value);}}),
              h("small",null, retirement.currentAge + " years old")
            ),
            h("div",{className:"field"},
              h("label",null,"Retirement age"),
              h("input",{type:"range",className:"slider",min:45,max:75,step:1,value:retirement.retireAge,onChange:function(e){updateRetirement("retireAge",e.target.value);}}),
              h("small",null, retirement.retireAge + " years old")
            ),
            h("div",{className:"field"},
              h("label",null,"Current monthly expenses"),
              h("input",{type:"range",className:"slider",min:2000000,max:100000000,step:1000000,value:retirement.monthlyExpense,onChange:function(e){updateRetirement("monthlyExpense",e.target.value);}}),
              h("small",null, formatRupiah(retirement.monthlyExpense) + " / month")
            ),
            h("div",{className:"field"},
              h("label",null,"Years of retirement to cover"),
              h("input",{type:"range",className:"slider",min:5,max:35,step:1,value:retirement.lifeExpectancy,onChange:function(e){updateRetirement("lifeExpectancy",e.target.value);}}),
              h("small",null, retirement.lifeExpectancy + " years")
            )
          ),
          h("div",{className:"calc-row"},
            h("div",{className:"field"},
              h("label",null,"Current retirement savings"),
              h("input",{type:"range",className:"slider",min:0,max:1000000000,step:5000000,value:retirement.currentSavings,onChange:function(e){updateRetirement("currentSavings",e.target.value);}}),
              h("small",null, formatRupiah(retirement.currentSavings))
            ),
            h("div",{className:"field"},
              h("label",null,"Expected annual return"),
              h("input",{type:"range",className:"slider",min:0,max:20,step:0.5,value:retirement.rate,onChange:function(e){updateRetirement("rate",e.target.value);}}),
              h("small",null, retirement.rate + "% / year")
            )
          ),
          h("h3",{className:"calc-subhead calc-subhead-spaced"},"Projection"),
          h("div",{className:"proj-card"},
            h("div",{className:"proj-head"},
              h("span",{className:"proj-name"}, retirementResult.yearsToRetire + " years to retirement"),
              h("span",{className:"proj-numbers"},
                h("span",null, "Target pot: ", h("b",null,formatRupiah(retirementResult.totalPotNeeded))),
                h("span",null, "Monthly investment needed: ", h("b",null,formatRupiah(retirementResult.requiredMonthly)))
              )
            ),
            h("div",{className:"chart-label"},"Retirement fund growth curve"),
            h(GrowthChart,{points:retirementSeries,uid:"ret1"})
          ),
          h("p",{className:"calc-disclaimer"},"Estimates only, based on the inflation and return assumptions you set. Actual investment results may differ.")
        )
      )
    ),

    h("section",{className:"section",id:"calc-emergency"},
      h("div",{className:"wrap"},
        h("div",{className:"section-head"},
          h("div",{className:"eyebrow"}, h("span",{className:"dot"}), " Finance"),
          h("h2",null,"Emergency Fund Calculator"),
          h("p",{className:"section-sub"},"How much cash buffer you need, and how long it'll take to reach it at your current saving pace.")
        ),
        h("div",{className:"calc-card glass"},
          h("div",{className:"calc-row"},
            h("div",{className:"field"},
              h("label",null,"Essential monthly expenses"),
              h("input",{type:"range",className:"slider",min:1000000,max:50000000,step:500000,value:emergency.monthlyExpenses,onChange:function(e){updateEmergency("monthlyExpenses",e.target.value);}}),
              h("small",null, formatRupiah(emergency.monthlyExpenses) + " / month")
            ),
            h("div",{className:"field"},
              h("label",null,"Coverage target"),
              h("input",{type:"range",className:"slider",min:3,max:12,step:1,value:emergency.months,onChange:function(e){updateEmergency("months",e.target.value);}}),
              h("small",null, emergency.months + " months of expenses")
            ),
            h("div",{className:"field"},
              h("label",null,"Current savings"),
              h("input",{type:"range",className:"slider",min:0,max:500000000,step:1000000,value:emergency.currentSavings,onChange:function(e){updateEmergency("currentSavings",e.target.value);}}),
              h("small",null, formatRupiah(emergency.currentSavings))
            ),
            h("div",{className:"field"},
              h("label",null,"Monthly saving capacity"),
              h("input",{type:"range",className:"slider",min:500000,max:50000000,step:500000,value:emergency.monthlySaving,onChange:function(e){updateEmergency("monthlySaving",e.target.value);}}),
              h("small",null, formatRupiah(emergency.monthlySaving) + " / month")
            )
          ),
          h("h3",{className:"calc-subhead calc-subhead-spaced"},"Projection"),
          h("div",{className:"proj-card"},
            h("div",{className:"proj-head"},
              h("span",{className:"proj-name"},"Target buffer"),
              h("span",{className:"proj-numbers"},
                h("span",null, "Target: ", h("b",null,formatRupiah(emergencyResult.target))),
                h("span",null, "Still needed: ", h("b",null,formatRupiah(emergencyResult.gap))),
                h("span",null, "Time to reach it: ", h("b",null, emergencyResult.monthsToGoal === null ? "—" : Math.ceil(emergencyResult.monthsToGoal) + " months"))
              )
            ),
            h(ProgressBar,{pct:emergencyResult.pct}),
            h("div",{className:"progress-caption"},
              h("span",null, formatRupiah(Number(emergency.currentSavings)||0) + " saved"),
              h("span",null, Math.round(emergencyResult.pct) + "%")
            )
          ),
          h("p",{className:"calc-disclaimer"},"An emergency fund is meant to stay liquid and low-risk, so this estimate does not assume investment growth.")
        )
      )
    ),

    h("section",{className:"section",id:"contact"},
      h("div",{className:"wrap"},
        h("div",{className:"section-head"},
          h("h2",null,"Get in touch"),
          h("p",{className:"section-sub"},"Leave your email and I'll follow up directly.")
        ),
        h("form",{className:"contact-card glass",onSubmit:handleContactSubmit},
          h("div",{className:"field"},
            h("label",{htmlFor:"contact-email"},"Email"),
            h("input",{id:"contact-email",type:"email",required:true,value:contact.email,onChange:function(e){setContact(Object.assign({},contact,{email:e.target.value}));},placeholder:"you@example.com"})
          ),
          h("div",{className:"field"},
            h("label",{htmlFor:"contact-message"},"Message (optional)"),
            h("textarea",{id:"contact-message",value:contact.message,onChange:function(e){setContact(Object.assign({},contact,{message:e.target.value}));},placeholder:"What would you like to talk about?"})
          ),
          h("button",{type:"submit",className:"btn btn-primary",disabled:contactStatus==="sending"}, contactStatus==="sending" ? "Sending..." : "Send"),
          contactStatus === "sent" && h("div",{className:"contact-status sent"},"Thanks — I'll be in touch by email soon."),
          contactStatus === "error" && h("div",{className:"contact-status error"},"Something went wrong sending that. Please try again in a moment.")
        )
      )
    ),

    h("section",{className:"section",id:"admin"},
      h("div",{className:"wrap"},
        h("div",{className:"section-head"},
          h("h2",null,"Admin"),
          h("p",{className:"section-sub"},"Optional — log in to manually manage portfolio pieces or review contact submissions.")
        ),
        !isAdmin
          ? h(LoginForm,{onLogin:handleLogin,error:loginError})
          : h(React.Fragment,null,
              h("div",{className:"admin-grid"},
                h(AdminForm,{draft:draft,setDraft:setDraft,onSubmit:handleSubmit,onCancel:resetDraft}),
                h("div",{className:"admin-panel glass"},
                  h("span",{className:"badge-admin"},"Manage pieces"),
                  items.map(function(item){
                    return h("div",{className:"item-manage-row",key:item.id},
                      h("span",null,item.title),
                      h("div",{style:{display:"flex",gap:"8px"}},
                        h("button",{className:"btn btn-ghost btn-small",onClick:function(){handleEdit(item);}},"Edit"),
                        h("button",{className:"btn btn-danger btn-small",onClick:function(){handleDelete(item.id);}},"Delete")
                      )
                    );
                  }),
                  h("div",{style:{marginTop:"16px"}}, h("button",{className:"btn btn-ghost btn-small",onClick:function(){setIsAdmin(false);}},"Log out"))
                )
              ),
              h("div",{className:"admin-panel glass",style:{marginTop:"20px"}},
                h("span",{className:"badge-admin"},"Contact submissions"),
                h("div",{className:"form-row",style:{marginTop:0}},
                  h("button",{type:"button",className:"btn btn-ghost btn-small",onClick:loadSubmissions}, submissionsLoading ? "Loading..." : "Load submissions")
                ),
                !CONTACT_SHEET_CSV_URL && h("p",{style:{color:"var(--ink-soft)",fontSize:"0.82rem",marginTop:"10px"}},"Not connected yet — set CONTACT_SHEET_CSV_URL to the published CSV link of your response sheet."),
                submissions && submissions.length > 0 && h("table",{className:"submissions-table"},
                  h("thead",null, h("tr",null, submissions[0].map(function(c,i){ return h("th",{key:i},c); }))),
                  h("tbody",null, submissions.slice(1).map(function(row,ri){
                    return h("tr",{key:ri}, row.map(function(cell,ci){ return h("td",{key:ci},cell); }));
                  }))
                ),
                submissions && submissions.length === 0 && CONTACT_SHEET_CSV_URL && h("p",{style:{color:"var(--ink-soft)",fontSize:"0.82rem",marginTop:"10px"}},"No submissions yet.")
              )
            )
      )
    ),

    h("footer",null,
      h("div",{className:"wrap footer-inner"},
        h("span",{className:"footer-credit"},"© " + new Date().getFullYear() + " Desta Riani. All rights reserved."),
        h("span",null,
          h("a",{href:INSTAGRAM_URL,target:"_blank",rel:"noopener noreferrer"},"Instagram"),
          " · ",
          h("a",{href:GITHUB_URL,target:"_blank",rel:"noopener noreferrer"},"GitHub")
        )
      )
    ),
    h(Lightbox,{item:lightboxItem,onClose:function(){setLightboxItem(null);}})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
