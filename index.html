<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Field Log — notes on markets, ink, and showing up</title><meta name="description" content="A running log on investing, patience, and drawing — by a market observer still figuring it out." /><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet"><script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script><script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script><style>
:root{--paper:#F6ECE7;--paper-2:#EEDAD2;--card:#FCF6F2;--ink:#3A2530;--ink-soft:#8B6B72;--rule:#DCC0C4;--wine:#7A2438;--gold:#B98A3E;--sage:#5C7A63;--rust:#B1543A;--radius:8px;--shadow:0 1px 0 rgba(122,36,56,0.12), 0 10px 22px rgba(58,37,48,0.10);}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Karla',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;letter-spacing:-0.01em;font-weight:500;}
.mono{font-family:'Courier Prime','Courier New',monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,20px);position:relative;z-index:1;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(rgba(122,36,56,0.05) 0px,rgba(122,36,56,0.05) 1px,transparent 1px,transparent 34px);mask-image:linear-gradient(to bottom,#000 0%,transparent 55%);}

.corner{position:absolute;width:34px;height:14px;background:rgba(185,138,62,0.28);border:1px solid rgba(122,36,56,0.15);pointer-events:none;transform:rotate(-4deg);top:-8px;left:18px;box-shadow:0 2px 3px rgba(58,37,48,0.12);}
.corner.tr,.corner.bl,.corner.br{display:none;}
.sparkle{position:absolute;color:var(--gold);pointer-events:none;animation:twinkle 3.4s ease-in-out infinite;z-index:2;}
@keyframes twinkle{0%,100%{opacity:0.3;transform:scale(0.8) rotate(0deg);}50%{opacity:0.9;transform:scale(1.05) rotate(10deg);}}
@media(prefers-reduced-motion:reduce){.sparkle{animation:none;opacity:0.6;}}

.panel{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);}
.log-card:nth-of-type(1){transform:rotate(-0.5deg);}
.log-card:nth-of-type(2){transform:rotate(0.4deg);}
.sketch-card:nth-of-type(1){transform:rotate(-0.6deg);}
.sketch-card:nth-of-type(2){transform:rotate(0.35deg);}
.sketch-card:nth-of-type(3){transform:rotate(-0.3deg);}

.tag-eyebrow{display:inline-block;font-family:'Courier Prime',monospace;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--wine);padding-bottom:5px;border-bottom:2px solid var(--gold);margin-bottom:18px;}
.tag-eyebrow .blip{display:none;}

.nav{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);}
.nav-inner{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:1.05rem;}
.brand-mark{width:26px;height:26px;border-radius:4px;background:var(--wine);display:flex;align-items:center;justify-content:center;font-family:'Courier Prime',monospace;color:var(--paper);font-size:0.72rem;font-weight:700;flex-shrink:0;}
.nav-links{display:flex;align-items:center;gap:22px;font-size:0.88rem;font-weight:500;}
.nav-links>a{text-decoration:none;color:var(--ink-soft);transition:color .15s;}
.nav-links>a:hover{color:var(--wine);}
.nav-toggle{display:none;align-items:center;justify-content:center;background:none;border:1px solid var(--rule);border-radius:6px;color:var(--ink);padding:6px 10px;}

.btn{border:none;border-radius:6px;padding:10px 18px;font-weight:600;font-size:0.85rem;transition:transform .15s,box-shadow .15s;}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--wine);outline-offset:2px;}
.btn-primary{background:var(--wine);color:var(--paper);box-shadow:0 2px 0 rgba(58,20,30,0.4);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(58,20,30,0.4);}
.btn-primary:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-ghost:hover{background:rgba(58,37,48,0.06);}

.hero{padding:clamp(40px,7vw,64px) 0 40px;}
.hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:44px;align-items:center;}
.hero h1{font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.16;font-weight:500;}
.hero h1 .hl{color:var(--wine);font-style:italic;}
.hero p.lead{color:var(--ink-soft);font-size:1.02rem;line-height:1.65;max-width:48ch;margin:18px 0 26px;}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;}
.hero-art{position:relative;display:flex;align-items:center;justify-content:center;padding:26px;transform:rotate(1.4deg);}
.hero-art svg{width:100%;max-width:340px;height:auto;}

.ticker-section{border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule);background:var(--paper-2);}
.ticker-mask{overflow:hidden;padding:11px 0;}
.ticker-track{display:flex;width:max-content;animation:scroll 32s linear infinite;}
@media(prefers-reduced-motion:reduce){.ticker-track{animation:none;overflow-x:auto;}}
.ticker-item{display:flex;align-items:center;gap:7px;padding:0 20px;border-right:1px solid var(--rule);font-family:'Courier Prime',monospace;font-size:0.78rem;white-space:nowrap;color:var(--ink-soft);}
.ticker-item b{color:var(--ink);}
.ticker-item .up{color:var(--sage);}
.ticker-item .down{color:var(--rust);}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

.section{padding:clamp(38px,6.5vw,54px) 0;position:relative;z-index:1;}
.section-head{margin-bottom:26px;}
.section-head h2{font-size:clamp(1.35rem,2.4vw,1.85rem);}
.section-sub{color:var(--ink-soft);font-size:0.92rem;margin-top:6px;max-width:60ch;}

.hero-grid,.log-grid{}
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.log-card{padding:22px;}
.log-card p{color:var(--ink-soft);line-height:1.65;font-size:0.94rem;}
.stat-row{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;}
.stat b{display:block;font-family:'Fraunces',serif;font-size:1.35rem;color:var(--wine);}
.stat span{font-size:0.76rem;color:var(--ink-soft);}

.calc-card{padding:24px;margin-bottom:22px;}
.calc-card:last-child{margin-bottom:0;}
.calc-kicker{font-family:'Courier Prime',monospace;font-size:0.7rem;color:var(--gold);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px;}
.calc-subhead{font-size:1rem;font-family:'Fraunces',serif;margin-bottom:14px;}
.calc-note{font-size:0.8rem;color:var(--ink-soft);margin-top:-8px;margin-bottom:16px;}
.calc-row{display:grid;grid-template-columns:1.1fr 1.3fr 1fr 1fr auto;gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--rule);}
.calc-row:first-of-type{padding-top:0;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:6px;color:var(--ink);}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--rule);font-family:inherit;font-size:0.9rem;background:var(--paper);color:var(--ink);}
.field textarea{resize:vertical;min-height:90px;}
.field small{color:var(--ink-soft);font-size:0.76rem;display:block;margin-top:4px;font-family:'Courier Prime',monospace;}
.numfield-row{display:flex;align-items:center;gap:10px;}
.numfield-row input[type="number"]{width:104px;flex:0 0 auto;}
.numfield-row input[type="range"]{flex:1;min-width:80px;}
@media(max-width:480px){.numfield-row{flex-wrap:wrap;}.numfield-row input[type="number"]{width:100%;order:2;}.numfield-row input[type="range"]{order:1;width:100%;}}
input.slider,input[type="range"]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--rule);outline:none;}
input.slider::-webkit-slider-thumb,input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--wine);cursor:pointer;border:2px solid var(--card);}
input.slider::-moz-range-thumb,input[type="range"]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--wine);border:2px solid var(--card);cursor:pointer;}
.form-row{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap;}

.proj-card{padding:16px 0;border-bottom:1px dotted var(--rule);}
.proj-card:last-of-type{border-bottom:none;}
.proj-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
.proj-name{font-weight:700;font-family:'Fraunces',serif;}
.proj-numbers{display:flex;gap:18px;flex-wrap:wrap;font-size:0.82rem;color:var(--ink-soft);font-family:'Courier Prime',monospace;}
.proj-numbers b{color:var(--wine);}
.chart-label{font-size:0.74rem;color:var(--ink-soft);margin:6px 0;font-family:'Courier Prime',monospace;}
.growth-chart{width:100%;height:100px;display:block;}
.calc-total{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);font-size:1rem;color:var(--ink-soft);}
.calc-total b{color:var(--wine);font-family:'Fraunces',serif;font-size:1.1rem;}
.calc-disclaimer{margin-top:12px;font-size:0.76rem;color:var(--ink-soft);}
.progress-track{width:100%;height:10px;border-radius:5px;background:var(--paper-2);overflow:hidden;margin-top:6px;border:1px solid var(--rule);}
.progress-fill{height:100%;background:var(--gold);transition:width .4s ease;}
.progress-caption{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--ink-soft);margin-top:6px;font-family:'Courier Prime',monospace;}

.sketch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.sketch-card{padding:18px;}
.sketch-card .porthole{aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid var(--card);box-shadow:0 0 0 1px var(--rule);margin-bottom:14px;}
.sketch-card .porthole svg{width:100%;height:100%;display:block;}
.sketch-card .k{font-family:'Courier Prime',monospace;font-size:0.68rem;color:var(--gold);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.sketch-card h3{font-size:1rem;}
.sketch-card p{color:var(--ink-soft);font-size:0.86rem;margin-top:6px;line-height:1.55;}
.sketch-cta{grid-column:1/-1;text-align:center;padding:26px;border:1.5px dashed var(--rule);border-radius:var(--radius);}
.sketch-cta p{color:var(--ink-soft);margin:0 0 12px;}
.sketch-cta strong{color:var(--ink);}

.contact-card{padding:26px;max-width:520px;}
.contact-status{margin-top:14px;font-size:0.85rem;padding:10px 14px;border-radius:6px;}
.contact-status.sent{background:rgba(92,122,99,0.14);color:var(--sage);}
.contact-status.error{background:rgba(177,84,58,0.14);color:var(--rust);}

.spec-panel{padding:22px;}
.spec-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dotted var(--rule);font-size:0.85rem;}
.spec-row:last-child{border-bottom:none;}
.spec-row span:first-child{color:var(--ink-soft);font-family:'Courier Prime',monospace;font-size:0.78rem;}
.spec-row span:last-child{color:var(--ink);text-align:right;}

.tips-panel{padding:22px;}
.tips-panel ul{list-style:none;margin:0;padding:0;}
.tips-panel li{display:flex;gap:10px;padding:10px 0;border-bottom:1px dotted var(--rule);font-size:0.88rem;color:var(--ink-soft);line-height:1.5;}
.tips-panel li:last-child{border-bottom:none;}
.tips-panel li i{font-style:normal;color:var(--gold);font-family:'Courier Prime',monospace;flex-shrink:0;}

.instr-group-label{display:flex;align-items:center;gap:10px;font-family:'Courier Prime',monospace;font-size:0.72rem;color:var(--wine);text-transform:uppercase;letter-spacing:0.08em;margin:30px 0 14px;}
.instr-group-label:first-child{margin-top:0;}
.instr-group-label::after{content:"";flex:1;height:1px;background:var(--rule);}

footer{border-top:1px solid var(--rule);padding:30px 0;color:var(--ink-soft);font-size:0.84rem;}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.footer-inner a{text-decoration:none;font-weight:600;color:var(--wine);}
.footer-inner a:hover{text-decoration:underline;}
.footer-note{font-size:0.78rem;opacity:0.85;}
.ghost-link{color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;}
.ghost-link:hover{color:var(--wine);}

.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease;}
.reveal.from-left{transform:translateX(-18px);}
.reveal.from-right{transform:translateX(18px);}
.reveal.in{opacity:1;transform:translate(0,0);}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1 !important;transform:none !important;transition:none !important;}}

@media(max-width:860px){
.hero-grid,.about-grid{grid-template-columns:1fr;}
.hero-art{order:-1;}
.log-grid,.sketch-grid{grid-template-columns:1fr 1fr;}
.nav-toggle{display:flex;}
.nav-links{display:none;position:absolute;top:56px;left:0;right:0;flex-direction:column;align-items:flex-start;gap:4px;background:var(--paper);border-bottom:1px solid var(--rule);padding:14px 20px 18px;box-shadow:var(--shadow);}
.nav-links.open{display:flex;}
.nav-links>a{padding:8px 0;}
.calc-row{grid-template-columns:1fr 1fr;}
}
@media(max-width:540px){
.log-grid,.sketch-grid{grid-template-columns:1fr;}
.calc-row{grid-template-columns:1fr;}
.hero{padding:32px 0 24px;}
.section{padding:32px 0;}
